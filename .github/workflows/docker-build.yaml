name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches: [build-node-docker]

env:
  # 你在 Docker Hub 上公开创建的仓库名（例如：node-docker）
  IMAGE_NAME: node-docker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ─── 核心修改 1：必须引入 QEMU，否则下方的 linux/arm64 编译会直接报错中断 ───
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            latest

      # ─── 核心修改 2：指向新创建的 Debian 基础 Dockerfile，并完美输出多架构 ───
      - name: Build and push Docker image (Debian Multi-Arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfiles/${{ env.IMAGE_NAME }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 同时构建出兼容标准服务器的 amd64 和兼容树莓派等设备的 arm64 公开镜像
          platforms: linux/amd64,linux/arm64
