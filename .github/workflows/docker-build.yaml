name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches: [build-node-docker]

env:
  # 你在 Docker Hub 上公开创建的仓库名（例如：node-docker）
  IMAGE_NAME: node-docker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_version: [22, 24]
        os_type: [slim, alpine]
        include:
          - os_type: slim
            file: ./dockerfiles/node-docker-slim
          - os_type: alpine
            file: ./dockerfiles/node-docker-alpine

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            # 生成如 24-slim, 22-alpine 等标签
            type=raw,value=${{ matrix.node_version }}-${{ matrix.os_type }}
            # 为每个 OS 类型生成不带 Node 版本的 latest 标签 (如 latest-slim 指向最新的 node-24)
            type=raw,value=latest-${{ matrix.os_type }},enable=${{ matrix.node_version == '24' }}
            # 最终的全局 latest 标签 (指向 node-24-slim)
            type=raw,value=latest,enable=${{ matrix.node_version == '24' && matrix.os_type == 'slim' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: |
            NODE_TAG=${{ matrix.node_version }}-${{ matrix.os_type }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
